
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //assignment operators
        var a =10;
        var b =20;
        var c=2;
        var d = "20";
        var e =10;
        document.write(c++,"<br/>");
        document.write(++c,"<br/>");
        document.write(c--,"<br/>");
        document.write(--c,"<br/>");

        //arithematic operators
        document.write("Additon a+b+c = ",a+b+c ,"<br/>");
        document.write("Sub a-b-c = ",a-b-c,"<br/>");
        document.write("Mul a*b*c = ",a*b*c,"<br/>");
        document.write("Div a/b = ",a/b,"<br/>");
        document.write("Modulud a%c = ",a%2,"<br/>");
        document.write("Exponentinal a**c= ",a**2,"<br/>");

        //Relational operators
        document.write(a>b,"<br/>");
        document.write(c<b,"<br/>");
        document.write(a>=e,"<br/>");
        document.write(a<=e,"<br/>");
        document.write(a==e,"<br/>");
        document.write(b===d,"<br/>");
        document.write(b==d,"<br/>");

        //logical operators
        document.write(a++>=a && a++ > ++a ,"<br/>"); //AND OPERATOR
        document.write(a++>=a || a++ > ++a,"<br/>"); //OR OPERATOR
        document.write(!(a++>=a),"<br/>"); //NOT OPERATOR

        //bitwise operator
        document.write(a&b,"<br/>");
        document.write(a|b,"<br/>");
        document.write(a^b,"<br/>");
        document.write(b>>1,"<br/>");
        document.write(b<<1,"<br/>");
        document.write(b>>>1,"<br/>");

    </script>
</body>
</html>

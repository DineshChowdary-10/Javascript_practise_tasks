<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<h1>Arthematic operatos</h1>")
        var b = 11;

        document.write("before b",b,"<br/>");
        b=b+1;
        document.write("after b",b,"<br/>");

        document.write("<h1>Assignment operatos</h1>")

        var c =100;

        document.write("before c",c,"<br/>");
        c+=1;
        document.write("after c",c,"<br/>");

        document.write("<h1>unary operatos</h1>")
        var a = 1;

        document.write(++a,"<br/>");   
        document.write(a++,"<br/>");

        var n=10;
        
        document.write(n++,"<br/>"); 
        document.write(n,"<br/>"); 
        
        var m =100;
        document.write(++m,"<br/>");
        document.write(m,"<br/>"); 
        




    </script>
</body>
</html>
